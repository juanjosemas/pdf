<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor PDF PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lobster&display=swap" rel="stylesheet">

<div id="toolbar">
  <input type="file" id="file" accept="application/pdf" style="width: 100%; max-width: 180px;">

  <button onclick="modoMover()" title="Mover">✋</button>
  <button onclick="modoTexto()">+ Texto</button>
  
  <button onclick="toggleBold()" style="font-family: Arial; font-weight: bold;">B</button>
  <button onclick="toggleItalic()" style="font-family: Arial; font-style: italic;">I</button>

  <button onclick="modoBorrar()">Borrar</button>
  <button onclick="modoImagen()">Imagen</button>

  <input type="color" id="colorTexto" value="#000000" style="width: 30px; height: 30px;">

  <button onclick="descargarPDF()" style="background: #007bff; color: white; border: none;">Descargar</button>
</div>

<div id="contenedor-scroll">
    <div id="contenedor"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>

</body>
</html>
