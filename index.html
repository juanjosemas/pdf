<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor PDF PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fuentes de Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Lobster&family=Metal+Mania&family=Yellowtail&family=Permanent+Marker&family=Piedra&family=Sriracha&display=swap" rel="stylesheet">

<div id="toolbar">
  <input type="file" id="file" accept="application/pdf">

  <button onclick="modoTexto()">Añadir texto</button>
  <button onclick="modoBorrar()">Borrar zona</button>
  <button onclick="modoImagen()">Insertar imagen</button>

  Color: <input type="color" id="colorTexto" value="#000000">

  <button onclick="descargarPDF()">Descargar PDF editado</button>
</div>

<div id="contenedor"></div>

<!-- Librerías Externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Tu lógica de JavaScript -->
<script src="script.js"></script>

</body>
</html>
